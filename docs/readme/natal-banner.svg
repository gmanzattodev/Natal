<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Natal — Momentos inesquecíveis</title><desc id="desc">Banner em verde profundo com pinheiros, estrelas douradas e enfeites natalinos em vinho.</desc>
