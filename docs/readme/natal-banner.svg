<text x="600" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="6" fill="#d6b879">UMA ÉPOCA EXTRAORDINÁRIA</text>
<text x="600" y="257" text-anchor="middle" font-family="Georgia,serif" font-size="116" fill="url(#gold)">Natal.</text>
<text x="600" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" letter-spacing="4" fill="#f4e9d8">MOMENTOS INESQUECÍVEIS</text>
